name: SlothSort tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight test tools
        run: python -m pip install -r requirements-dev.txt
      - name: Check test suite
        run: python -m pytest -q
      - name: Check source syntax
        run: python -m compileall -q slothsort app.py scripts tests
